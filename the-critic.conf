<VirtualHost *:80>
    ServerName 192.168.64.5

    # Redirige todo el tráfico del puerto 80 al servidor Node.js en puerto 3000
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Cabeceras para que Node.js reciba la IP real del cliente
    RequestHeader set X-Forwarded-For  "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  /var/log/apache2/the-critic-error.log
    CustomLog /var/log/apache2/the-critic-access.log combined
</VirtualHost>
