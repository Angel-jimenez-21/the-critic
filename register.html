<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrarse | The Critic</title>

  <!-- Tipografias -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Raleway:wght@400;500&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="nav container">
      <span class="logo">THE CRITIC</span>

      <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="videojuegos.html">Videojuegos</a></li>
        <li><a href="noticias.html">Noticias</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
      </ul>

      <div class="nav-auth">
        <a href="login.html">Iniciar sesion</a> /
        <a class="is-active" href="register.html">Registrarse</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="register-section">
      <div class="container register-layout">
        <div>
          <h1 class="register-title">Crea tu cuenta</h1>
          <form class="register-form">
            <label class="register-label" for="username">Nombre de usuario</label>
            <input id="username" class="register-input" name="username" type="text" placeholder="Elige tu nombre de usuario" required>

            <label class="register-label" for="email">Email</label>
            <input id="email" class="register-input" name="email" type="email" placeholder="Correo electronico" required>

            <label class="register-label" for="password">Contraseña</label>
            <input id="password" class="register-input" name="password" type="password" placeholder="Contraseña" required>

            <input id="confirm" class="register-input" name="confirmPassword" type="password" placeholder="Confirmar contraseña" required>

            <label class="register-checkbox">
              <input name="terms" type="checkbox" required>
              <span>Acepto términos y politica de privacidad</span>
            </label>

            <button class="register-button" type="submit">Crear cuenta</button>
            <span class="register-login">¿Tienes cuenta? <a href="login.html">Inicia sesión aqui</a></span>
          </form>
        </div>
        <img class="register-image" src="assets/img/registro.png" alt="Imagen de registro">
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-top">
        <span class="logo">THE CRITIC</span>
        <ul class="footer-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="videojuegos.html">Videojuegos</a></li>
          <li><a href="noticias.html">Noticias</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="login.html">Iniciar sesion</a></li>
          <li><a href="register.html">Registrarse</a></li>
        </ul>
      </div>
      <div class="footer-bottom">
        <span>© 2026 The Critic</span>
        <a href="#">Politica de privacidad</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/main.js"></script>
</body>
</html>
